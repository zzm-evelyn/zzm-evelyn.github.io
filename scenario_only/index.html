<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情景体验研究</title>
  <link rel="stylesheet" href="css/style.css?v=20261124">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="welcome-ornament">🌸</div>
      <h1 class="study-title">情景体验研究</h1>
      <p class="study-subtitle">
        欢迎参加本次情景体验。请根据自己的真实感受选择最符合您的选项。
      </p>

      <div class="research-info">
        <p><strong>研究说明</strong></p>
        <p>本情景为旅游体验，请根据你在体验中的真实感受选择最符合您的选项。下面，请填写您的体验编号，之后体验开始~祝您旅途愉快！</p>
        <p>完成情景体验后，系统会根据您的选择生成一份独立报告。</p>
      </div>

      <div class="privacy-note">
        <strong>隐私说明</strong><br>
        本研究采用匿名方式收集数据。您的回答仅用于学术研究目的，不会与任何个人身份信息关联。
      </div>

      <div class="participant-id-section">
        <label for="participantIdInput"><strong>请输入您的编号</strong></label>
        <input id="participantIdInput" class="form-input participant-id-input" type="text" placeholder="留空将自动生成编号" autocomplete="off">
      </div>

      <button id="startScenarioBtn" class="btn btn-primary btn-block btn-lg" onclick="startScenarioOnly()">
        开始情景体验
      </button>

      <div id="participantIdDisplay" class="participant-id-display"></div>
    </div>
  </div>

  <script src="js/config.js?v=20261124"></script>
  <script src="js/apiClient.js?v=20261124"></script>
  <script src="js/mockData.js?v=20261124"></script>
  <script src="js/storage.js?v=20261124"></script>
  <script src="js/scoring.js?v=20261124"></script>
  <script src="js/app.js?v=20261124"></script>
  <script>
    const SCENARIO_ONLY_GAME_KEY = 'game_a';

    function getScenarioOnlyGameKey() {
      return normalizeGameKey(getQueryParam('game') || SCENARIO_ONLY_GAME_KEY);
    }

    var scenarioStartInProgress = false;

    async function startScenarioOnly() {
      if (scenarioStartInProgress) return;
      var input = document.getElementById('participantIdInput');
      var customId = input ? input.value.trim() : '';
      var button = document.getElementById('startScenarioBtn');
      scenarioStartInProgress = true;
      if (button) { button.disabled = true; button.textContent = '正在连接，请稍候...'; }
      try {
        var options = { forceNew: true, requireBackend: true };
        var result = await startParticipantSession(customId || undefined, options);
        if (result && result.status === 'resume_available') {
          if (!confirm('该编号有未完成的作答，是否继续？如需全新体验，请取消并使用新的编号。')) return;
          result = await startParticipantSession(customId, {
            forceNew: true, requireBackend: true, action: 'resume'
          });
        }
        if (result && result.status === 'already_completed') {
          alert('该编号已完成，请使用新的演示编号。');
          return;
        }
        if (!hasBackendSession() || (result && typeof result === 'object')) {
          throw new Error('会话尚未就绪，请稍后重试');
        }
        localStorage.setItem('scenario_only_game_key', JSON.stringify(getScenarioOnlyGameKey()));
        navigateTo('game.html?game=' + encodeURIComponent(getScenarioOnlyGameKey()));
      } catch (e) {
        alert('进入失败：' + e.message + '。请稍后重试。');
      } finally {
        scenarioStartInProgress = false;
        if (button) { button.disabled = false; button.textContent = '开始情景体验'; }
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var pid = localStorage.getItem('participant_id');
      if (pid) {
        var display = document.getElementById('participantIdDisplay');
        if (display) {
          display.textContent = '参与者编号：' + (getParticipantLabel() || JSON.parse(pid));
        }
      }
    });
  </script>
</body>
</html>
